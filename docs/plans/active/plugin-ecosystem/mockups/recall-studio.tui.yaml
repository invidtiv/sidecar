                - text: ""
                - text: "[dim]recall does not list; it answers. Press [/dim][kbd:/][dim] to ask.[/dim]"
                  align: center
                - text: ""
                - text: ""
                - text: "[dim]4 sources · profile [/dim][fg:accent]default[/fg][dim] · last refresh 1m ago[/dim]"
