                    right: "[dim]sort[/dim] rank "
                - divider: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
