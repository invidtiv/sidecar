                - text: ""
                - text: " [kbd:a] [dim]offers[/dim] Refresh source [dim]on the row and[/dim]"
                - text: "     Refresh all [dim]on the collection — both are[/dim]"
                - text: "     [dim]plugin actions, confirmed by the host.[/dim]"
