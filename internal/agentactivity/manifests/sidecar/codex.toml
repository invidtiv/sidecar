# Sidecar overlay for Codex. Local rules preserve captured behavior; upstream
# lifecycle authority and the no-match fallback remain separate.

id = "codex"

# A turn waiting on a running background terminal is working. Require the
# waiting line, a positive running count, and both terminal-control hints;
# a finished wait or a helper running on its own must not match. Upstream's
# screen_working_fallback also recognizes the captured background-terminal
# fixture. At equal priority, the upstream rule remains the reported evidence.
[[rules]]
id = "sidecar.background_terminal_working"
state = "working"
priority = 500
region = "bottom_non_empty_lines(12)"
visible_working = true
regex = ['(?ims)^\s*[•◦]?\s*Waiting for background terminal\b.*[1-9][0-9]* background terminals? running\b.*(?:/ps to view.*?/stop to close|/stop to close.*?/ps to view)']

# Explicit idle requires the composer with no interrupt hint in this region.
# Codex draws its composer during active tool calls too, so the negative gate
# prevents a visible idle while the turn is still running. Herdr no longer has
# osc_title_idle: a plain title supplies no completion evidence.
[[rules]]
id = "sidecar.composer_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(8)"
visible_idle = true
line_regex = ['^\s*›(?:\s|$)']
not = [{ regex = ['(?i)esc to interrupt'] }]

# This narrow Working/timer match reads the last twelve non-empty lines and
# refuses quoted or interrupted status. Upstream's broader working rule now
# reads before_current_prompt_marker and wins on the captured running-tool
# screen. Keep upstream's priority higher so its evidence remains visible.
# When an interrupted screen matches neither a working rule nor composer idle,
# the result is codex_state_ambiguous, never a completion.
[[rules]]
id = "sidecar.working_chrome"
state = "working"
priority = 490
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^[•◦]\s+Working \(.*esc to interrupt\)']
not = [{ contains = ["■ Conversation interrupted"] }]

# Codex uses its composer glyph on an approval option. That can empty both
# prompt-relative blocker regions, so this rule reads the recent question
# directly. Its priority sits below live_strong_blocker and above weak_blocker.
#
# An answered question still in these twelve lines can continue to report
# blocked. No captured post-answer shape justifies narrowing that gate yet;
# retain attention rather than miss an unanswered approval. The captured
# approval_prompt.txt and blocked.txt screens protect this behavior.
[[rules]]
id = "sidecar.approval_blocker"
state = "blocked"
priority = 700
region = "bottom_non_empty_lines(12)"
visible_blocker = true
regex = ['(?i)(Action Required|Would you like to run|Press enter to confirm|Allow command)']

# Upstream's weak blocker, with visible_blocker=true for Sidecar's attention
# badge. State, region, priority and matching stay aligned with upstream; the
# differential harness verifies them. Remove this replacement if the captured
# weak_blocker.txt question no longer merits attention or upstream adds the flag.
[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
visible_blocker = true
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]
