# Sidecar overlay for muse.
#
# One rule, and it exists because Muse is the provider where an unrecognised
# working screen is not merely unknown: upstream carries two explicit idle rules
# (`idle_prompt` at 700 and `idle_status_fallback` at 500), and both are
# `visible_idle`. A live turn upstream cannot see does not fall through to the
# low-evidence fallback here — it reads as an explicitly, visibly idle pane, and
# the tracker turns a visible idle out of working into a completed turn.
#
# Upstream describes Muse's activity in terms of one hint: `working_esc_interrupt`
# (900) reads "esc to interrupt", which Muse Code 0.2.1 renders beside the
# elapsed timer on every active turn. Sidecar's own harvest is of Muse Code
# 1.0.1, a year newer, and the rule table it produced carried a second shape —
# a lozenge glyph in front of the activity word — as `muse.screen.thinking-glyph`.
# That is what this restores, and the Phase 2 review is why: dropping it turned a
# thinking pane whose composer is still drawn into a visible idle.

id = "muse"

# `◈ Thinking` with the composer still on screen.
#
# The gate is the deleted rule's, anchored to the head of a line rather than
# matched anywhere in sixteen: the glyph is chrome Muse paints in a status
# column, so a turn that merely writes the word "Thinking" mid-sentence cannot
# reach it. That anchoring is the whole difference between this rule and
# `muse.screen.working`, which matched the bare words "Thinking" or "Working"
# anywhere in the window and was dropped on purpose — upstream's own evidence
# note says Muse emits either phrase as ordinary assistant text after a
# completed turn.
#
# It is deliberately not widened past the one glyph and the one verb the harvest
# recorded. Upstream documents `◆ Working (… · esc to interrupt)` for 0.2.1, and
# any screen carrying that hint is already `working_esc_interrupt` at 900; a
# rule covering every glyph and every verb would be the speculative-rule mistake
# this cutover removed elsewhere. testdata/muse/thinking.txt is the fixture and
# it is labelled synthetic: the harvest that produced the pattern predates the
# fixture corpus and no capture of the screen survives.
#
# Priority 750 sits above both idle rules and below every blocker
# (`blocked_approval` 850, `pick_request_blocked` 950, `workspace_trust_blocked`
# 970) and below `menu_overlay` (940), so an overlay the user opened mid-turn
# still retains rather than reporting work.
#
# --- Column 0, and why the anchor is exact ---
#
# The pattern is `^◈\s+Thinking\b`, not `^\s*◈\s*Thinking\b`. The glyph is a
# status column, so on the one screen that carries it — thinking.txt, the
# reconstruction of the 1.0.1 harvest — it is the first character of the row,
# and the other Muse capture in the corpus (trust_workspace.txt, a real one)
# shows the same provider putting its own chrome in column 0. Allowing leading
# whitespace is what let `  ◈ Thinking while the turn runs` inside a quoted
# block reach the rule, which is the indented-prose case the anchor now refuses.
# There is no capture of the glyph indented; if one ever appears, widen this to
# `^\s{0,1}◈` and say so here rather than going back to `^\s*`.
#
# --- The settled-thought gate ---
#
# `◈ Thinking` can be left on a settled pane: the composer is drawn under it and
# the footer under that, so upstream's `idle_prompt` (700) has everything it
# needs and this rule at 750 was overriding it on a screen where the turn had
# already finished. The gate is the *completed* status row Muse paints in the
# same column when the thinking ends, `◈ Thought for 12s`, and it fires only
# when no `◈ Thinking` row appears after it.
#
# The nesting is load-bearing rather than clever, and this is the case it
# exists for. A multi-step turn paints
#
#   ◈ Thinking
#   ◈ Thought for 5s
#   ◈ Thinking          <- live
#
# and a flat `not` on the completed row would suppress the rule there, dropping
# a live turn onto upstream's `idle_prompt` — a visible idle mid-turn, which is
# the exact false "done" this rule was restored to prevent. The inner `not`
# says "and there is no Thinking row below the completed one", so the flat gate
# only applies to the settled shape:
#
#   ◈ Thinking / ◈ Thought for 12s / Done: … / ⟩ / footer   -> idle_prompt
#   ◈ Thinking / ◈ Thought for 5s / ◈ Thinking / ⟩          -> working
#
# The composer marker itself (`⟩`) cannot be the gate, which is the shape this
# started as. Muse keeps the composer drawn *during* a turn — that is the whole
# premise of the rule and thinking.txt shows two `⟩` rows on a working screen —
# so a `not` on it would delete the rule rather than narrow it.
#
# Both patterns describe rows nobody has captured: the harvest recorded the
# glyph and the verb, and `Thought for Ns` is the completed form of the same
# row. A capture of either is what would settle them. Until then the failure
# direction is chosen rather than accidental: where the gate is wrong the pane
# stays on the working lane, which announces nothing.
[[rules]]
id = "sidecar.thinking_working"
state = "working"
priority = 750
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^◈\s+Thinking\b']
not = [
  { line_regex = ['^◈\s+Thought\b'], not = [{ regex = ['(?ms)^◈\s+Thought\b.*^◈\s+Thinking\b'] }] },
]
